services:
  arche-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ARCHE_PRIVACY_SALT: ${ARCHE_PRIVACY_SALT:-arche-demo-salt}
      MONGODB_URL: mongodb://mongo:27017/arche
    volumes:
      - ./data:/app/data
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
